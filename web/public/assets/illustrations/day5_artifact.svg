<svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="1-page stakeholder report mockup">
  <defs>
    <style>
      .frame { fill: #fff; stroke: #d1d5db; stroke-width: 1; }
      .accent { fill: #f43f5e; }
      .h1 { font: 800 11.5px "Inter", sans-serif; fill: #0f172a; }
      .h2 { font: 700 8px "Inter", sans-serif; fill: #be123c; letter-spacing: 0.08em; text-transform: uppercase; }
      .body { fill: #94a3b8; }
      .body-strong { fill: #cbd5e1; }
      .chart-frame { fill: #fff5f7; stroke: #fda4af; stroke-width: 0.6; }
      .chart-bar { fill: #f43f5e; opacity: 0.85; }
      .bullet-dot { fill: #f43f5e; }
      .num { font: 700 8.5px "Inter", sans-serif; fill: #be123c; }
    </style>
  </defs>
  <rect class="frame" width="320" height="220" rx="6"/>
  <rect class="accent" width="320" height="6"/>

  <!-- Title -->
  <text class="h1" x="14" y="26">Olist customer-satisfaction analysis</text>
  <rect class="body-strong" x="14" y="30" width="180" height="2.5" rx="1"/>

  <!-- TL;DR section -->
  <text class="h2" x="14" y="48">TL;DR</text>
  <rect class="bullet-dot" x="14" y="54" width="3" height="3" rx="1.5"/>
  <rect class="body" x="22" y="55" width="200" height="2.2" rx="1"/>
  <rect class="body" x="22" y="60" width="240" height="2.2" rx="1"/>
  <rect class="bullet-dot" x="14" y="68" width="3" height="3" rx="1.5"/>
  <rect class="body" x="22" y="69" width="170" height="2.2" rx="1"/>
  <rect class="body" x="22" y="74" width="220" height="2.2" rx="1"/>
  <rect class="bullet-dot" x="14" y="82" width="3" height="3" rx="1.5"/>
  <rect class="body" x="22" y="83" width="190" height="2.2" rx="1"/>
  <rect class="body" x="22" y="88" width="210" height="2.2" rx="1"/>

  <!-- Finding 1 -->
  <text class="h2" x="14" y="106">Finding 1 — delivery drives satisfaction</text>
  <rect class="body" x="14" y="111" width="300" height="2.2" rx="1"/>
  <rect class="body" x="14" y="116" width="280" height="2.2" rx="1"/>
  <rect class="body" x="14" y="121" width="220" height="2.2" rx="1"/>

  <!-- Embedded chart -->
  <rect class="chart-frame" x="14" y="130" width="180" height="56" rx="2"/>
  <rect class="chart-bar" x="22"  y="138" width="14" height="42"/>
  <rect class="chart-bar" x="44"  y="146" width="14" height="34"/>
  <rect class="chart-bar" x="66"  y="158" width="14" height="22" opacity="0.5"/>
  <rect class="chart-bar" x="88"  y="166" width="14" height="14" opacity="0.5"/>
  <rect class="chart-bar" x="110" y="142" width="14" height="38"/>
  <rect class="chart-bar" x="132" y="150" width="14" height="30"/>
  <rect class="chart-bar" x="154" y="154" width="14" height="26"/>
  <rect class="chart-bar" x="176" y="162" width="14" height="18" opacity="0.5"/>

  <!-- Right column: recommendations -->
  <text class="h2" x="204" y="142">Recommended actions</text>
  <rect class="bullet-dot" x="204" y="148" width="3" height="3" rx="1.5"/>
  <text class="num" x="212" y="151">1</text>
  <rect class="body" x="222" y="149" width="86" height="2.2" rx="1"/>
  <rect class="body" x="222" y="154" width="78" height="2.2" rx="1"/>

  <rect class="bullet-dot" x="204" y="162" width="3" height="3" rx="1.5"/>
  <text class="num" x="212" y="165">2</text>
  <rect class="body" x="222" y="163" width="92" height="2.2" rx="1"/>
  <rect class="body" x="222" y="168" width="80" height="2.2" rx="1"/>

  <rect class="bullet-dot" x="204" y="176" width="3" height="3" rx="1.5"/>
  <text class="num" x="212" y="179">3</text>
  <rect class="body" x="222" y="177" width="86" height="2.2" rx="1"/>
  <rect class="body" x="222" y="182" width="70" height="2.2" rx="1"/>

  <!-- Footer line -->
  <rect class="body-strong" x="14" y="200" width="290" height="1.5" rx="0.5"/>
  <rect class="body" x="14" y="206" width="120" height="2" rx="1"/>
  <rect class="body" x="220" y="206" width="86" height="2" rx="1"/>
</svg>
