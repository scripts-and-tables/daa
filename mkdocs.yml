site_name: Data Analytics Academy
site_description: A 5-day, 20-hour intensive course taking absolute beginners from Excel to AI-assisted analytics.
site_url: https://scripts-and-tables.github.io/daa/
repo_url: https://github.com/scripts-and-tables/daa
repo_name: scripts-and-tables/daa
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono

extra_css:
  - stylesheets/custom.css

extra_javascript:
  - javascripts/extra.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/scripts-and-tables/daa

copyright: >
  Copyright &copy; 2026 Scripts and Tables — released under the MIT license.

not_in_nav: |
  404.md

nav:
  - Home: index.md
  - Course:
      - Day 1 — Excel:
          - curriculum/day1_excel/README.md
          - 1. Tables & references: curriculum/day1_excel/01_tables.md
          - 2. Math & aggregation: curriculum/day1_excel/02_aggregation.md
          - 3. Logic & lookups: curriculum/day1_excel/03_logic_lookups.md
          - 4. Dates & cleaning: curriculum/day1_excel/04_dates_cleaning.md
          - 5. Pivot tables & charts: curriculum/day1_excel/05_pivots.md
          - Self-test: curriculum/day1_excel/test.md
      - Day 2 — SQL:
          - curriculum/day2_sql/README.md
          - 1. SELECT, FROM, WHERE: curriculum/day2_sql/01_select_basics.md
          - 2. Aggregation & GROUP BY: curriculum/day2_sql/02_aggregation.md
          - 3. Joins: curriculum/day2_sql/03_joins.md
          - 4. CTEs & multi-step queries: curriculum/day2_sql/04_ctes.md
          - 5. NULLs, types & SQLite quirks: curriculum/day2_sql/05_nulls_and_quirks.md
          - Self-test: curriculum/day2_sql/test.md
      - Day 3 — Python:
          - curriculum/day3_python/README.md
          - 1. Notebooks & loading data: curriculum/day3_python/01_notebooks_and_loading.md
          - 2. Selecting & filtering: curriculum/day3_python/02_selecting_filtering.md
          - 3. Aggregation & groupby: curriculum/day3_python/03_groupby.md
          - 4. Merge & combine: curriculum/day3_python/04_merge.md
          - 5. Cleaning, dates, plots: curriculum/day3_python/05_cleaning_dates_plots.md
          - Self-test: curriculum/day3_python/test.md
      - Day 4 — Power BI:
          - curriculum/day4_powerbi/README.md
          - 1. Get Data & Power Query: curriculum/day4_powerbi/01_get_data_power_query.md
          - 2. The data model: curriculum/day4_powerbi/02_data_model.md
          - 3. Building visuals: curriculum/day4_powerbi/03_visuals.md
          - 4. DAX measures: curriculum/day4_powerbi/04_dax_measures.md
          - 5. Interactivity, layout, polish: curriculum/day4_powerbi/05_interactivity_and_polish.md
          - Self-test: curriculum/day4_powerbi/test.md
      - Day 5 — Claude Code:
          - curriculum/day5_claude_code/README.md
          - 1. Getting started: curriculum/day5_claude_code/01_getting_started.md
          - 2. Prompting that works: curriculum/day5_claude_code/02_prompting.md
          - 3. Plan mode & verification: curriculum/day5_claude_code/03_plan_mode_and_verification.md
          - 4. AI-assisted querying: curriculum/day5_claude_code/04_ai_assisted_querying.md
          - 5. Text analytics & the report: curriculum/day5_claude_code/05_text_and_report.md
          - Self-test: curriculum/day5_claude_code/test.md
  - Capstone:
      - Overview & rubric: capstone/README.md
      - Day 1 — Excel: capstone/day1_excel/README.md
      - Day 2 — SQL: capstone/day2_sql/README.md
      - Day 3 — Python: capstone/day3_python/README.md
      - Day 4 — Power BI: capstone/day4_powerbi/README.md
      - Day 5 — Final report: capstone/day5_ai/README.md
  - Dataset: data/README.md
  - Instructor:
      - Setup checklist: instructor/setup_checklist.md
      - Timing notes: instructor/timing_notes.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
