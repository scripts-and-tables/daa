{% extends "base.html" %}

{% block extrahead %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&display=swap"></noscript>
  {% if page and page.is_homepage %}
    <meta property="og:image" content="{{ config.site_url }}assets/illustrations/olist_schema.svg">
    <meta name="twitter:card" content="summary_large_image">
  {% endif %}
{% endblock %}
